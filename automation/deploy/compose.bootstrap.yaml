# Temporary owner setup over SSH forwarding only. Do not start Caddy in this mode.
# Compose 2.24.4+ is required for !override.
services:
  n8n:
    ports: !override
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_WEBHOOK_URL: http://localhost:5678/
      N8N_EDITOR_BASE_URL: http://localhost:5678/
